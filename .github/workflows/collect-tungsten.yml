name: Collect tungsten price
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"
      timezone: "Europe/Oslo"
permissions:
  contents: read
  id-token: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/578176779679/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: tungsten@tungsten-507906.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run collect
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
